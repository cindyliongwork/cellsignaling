<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cell Signaling - Interactive Knowledge Check Game</title>
    <style>
        :root {
            --primary: #0072CE;
            --primary-dark: #005A9E;
            --accent: #00A3E0;
            --accent-light: #E6F4FA;
            --success: #10B981;
            --danger: #EF4444;
            --background: #F8FAFC;
            --card-bg: rgba(255, 255, 255, 0.92);
            --text: #0F172A;
            --subtext: #475569;
            --border-radius: 16px;
        }
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Outfit', 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        }
        body {
            background-color: #0b1329;
            color: var(--text);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
            position: relative;
            overflow-x: hidden;
        }
        #bg-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: 0;
            pointer-events: none;
        }
        .game-container {
            width: 100%;
            max-width: 750px;
            background: var(--card-bg);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.4);
            border-radius: var(--border-radius);
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.3);
            overflow: hidden;
            position: relative;
            z-index: 1;
        }
        .header {
            background: linear-gradient(135deg, #003B70, #0072CE);
            color: white;
            padding: 28px;
            text-align: center;
            position: relative;
        }
        .header h1 {
            font-size: 2rem;
            margin-bottom: 6px;
            letter-spacing: -0.02em;
        }
        .audio-toggle-btn {
            position: absolute;
            top: 20px;
            right: 20px;
            background: rgba(255, 255, 255, 0.2);
            border: 1px solid rgba(255, 255, 255, 0.4);
            color: white;
            padding: 8px 12px;
            border-radius: 20px;
            cursor: pointer;
            font-size: 0.85rem;
            font-weight: 600;
            transition: background 0.2s;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .audio-toggle-btn:hover {
            background: rgba(255, 255, 255, 0.35);
        }
        .progress-bar-container {
            width: 100%;
            height: 8px;
            background: rgba(255,255,255,0.3);
            border-radius: 5px;
            margin-top: 15px;
            overflow: hidden;
        }
        .progress-bar {
            height: 100%;
            width: 0%;
            background: #00A3E0;
            transition: width 0.4s ease;
        }
        .stats-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 24px;
            background: rgba(241, 245, 249, 0.9);
            font-weight: 600;
            font-size: 0.9rem;
            color: var(--subtext);
        }
        .streak-badge {
            background: linear-gradient(135deg, #FF6B6B, #FF8E53);
            color: white;
            padding: 3px 10px;
            border-radius: 12px;
            font-size: 0.8rem;
            font-weight: 700;
            display: inline-flex;
            align-items: center;
            gap: 4px;
            box-shadow: 0 2px 6px rgba(255, 107, 107, 0.3);
        }
        .ars-inventory {
            display: flex;
            align-items: center;
            gap: 4px;
            min-height: 28px;
        }
        .ars-bottle-icon {
            width: 18px;
            height: 24px;
            animation: popIn 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        @keyframes popIn {
            0% { transform: scale(0) rotate(-20deg); opacity: 0; }
            70% { transform: scale(1.3) rotate(10deg); opacity: 1; }
            100% { transform: scale(1) rotate(0deg); opacity: 1; }
        }
        .ars-popout-overlay {
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            pointer-events: none;
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 100;
        }
        .popout-bottle {
            width: 120px;
            height: 160px;
            filter: drop-shadow(0 15px 25px rgba(0,114,206,0.4));
            animation: bottlePopOut 1.2s ease-out forwards;
        }
        @keyframes bottlePopOut {
            0% { transform: scale(0) translateY(50px) rotate(-15deg); opacity: 0; }
            35% { transform: scale(1.2) translateY(-20px) rotate(5deg); opacity: 1; }
            65% { transform: scale(1) translateY(0) rotate(0deg); opacity: 1; }
            100% { transform: scale(0.3) translateY(-200px); opacity: 0; }
        }
        .content-body {
            padding: 28px;
        }
        .question-title {
            font-size: 1.2rem;
            margin-bottom: 20px;
            color: var(--text);
            font-weight: 600;
        }
        .options-grid {
            display: grid;
            gap: 12px;
            margin-bottom: 20px;
        }
        .option-btn {
            background: rgba(255, 255, 255, 0.9);
            border: 2px solid #E2E8F0;
            padding: 14px 20px;
            border-radius: 10px;
            text-align: left;
            font-size: 1rem;
            cursor: pointer;
            transition: all 0.2s ease;
            color: var(--text);
            display: flex;
            align-items: center;
        }
        .option-btn:hover {
            border-color: var(--primary);
            background: #F0F9FF;
        }
        .option-btn.correct {
            background-color: #D1FAE5 !important;
            border-color: var(--success) !important;
            color: #065F46 !important;
            font-weight: bold;
        }
        .option-btn.incorrect {
            background-color: #FEE2E2 !important;
            border-color: var(--danger) !important;
            color: #991B1B !important;
        }
        .option-btn:disabled {
            cursor: default;
        }
        .explanation-box {
            display: none;
            padding: 16px;
            border-radius: 10px;
            background: rgba(240, 249, 255, 0.95);
            border-left: 5px solid var(--primary);
            margin-top: 15px;
            font-size: 0.95rem;
            line-height: 1.5;
        }
        .action-footer {
            display: flex;
            justify-content: flex-end;
            padding-top: 10px;
        }
        .btn-next {
            background: var(--primary);
            color: white;
            border: none;
            padding: 12px 28px;
            font-size: 1rem;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            display: none;
            transition: background 0.2s;
        }
        .btn-next:hover {
            background: var(--primary-dark);
        }
        .end-card {
            text-align: center;
            padding: 20px 10px;
        }
        .end-card h2 {
            font-size: 2rem;
            color: var(--primary);
            margin-bottom: 12px;
        }
        .score-display {
            font-size: 2.8rem;
            font-weight: 800;
            color: #0072CE;
            margin: 5px 0;
        }
        .correct-summary {
            font-size: 1.25rem;
            font-weight: 700;
            color: #10B981;
            margin-bottom: 10px;
        }
        .badges-container {
            display: flex;
            justify-content: center;
            gap: 12px;
            flex-wrap: wrap;
            margin: 20px 0;
        }
        .achievement-badge {
            background: #F1F5F9;
            border: 2px solid #CBD5E1;
            border-radius: 12px;
            padding: 10px 16px;
            display: flex;
            align-items: center;
            gap: 8px;
            font-weight: 700;
            font-size: 0.9rem;
            color: #334155;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
            animation: popIn 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        .achievement-badge.gold {
            background: #FEF3C7;
            border-color: #F59E0B;
            color: #92400E;
        }
        .achievement-badge.blue {
            background: #E0F2FE;
            border-color: #0284C7;
            color: #075985;
        }
        .achievement-badge.purple {
            background: #F3E8FF;
            border-color: #9333EA;
            color: #6B21A8;
        }
        .restart-btn {
            background: #00A3E0;
            color: white;
            border: none;
            padding: 14px 32px;
            font-size: 1.1rem;
            border-radius: 10px;
            cursor: pointer;
            font-weight: bold;
            margin-top: 15px;
        }
    </style>
</head>
<body>
<canvas id="bg-canvas"></canvas>
<div class="game-container">
    <div class="ars-popout-overlay" id="popout-overlay"></div>
    <div class="header">
        <button class="audio-toggle-btn" id="audio-toggle" onclick="toggleAudio()">🔊 Sound On</button>
        <h1>Cell Signaling Knowledge Check</h1>
        <div class="progress-bar-container">
            <div class="progress-bar" id="progress"></div>
        </div>
    </div>
    <div class="stats-bar">
        <span id="question-count">Question 1 of 10</span>
        <span id="correct-count">Correct: 0 / 10</span>
        <span class="streak-badge" id="streak-display" style="display:none;">🔥 Streak: 0</span>
        <div class="ars-inventory" id="ars-inventory"></div>
        <span id="score">Score: 0</span>
    </div>
    <div class="content-body" id="game-body">
        <div class="question-title" id="question-text"></div>
        <div class="options-grid" id="options-container"></div>
        <div class="explanation-box" id="explanation"></div>
        <div class="action-footer">
            <button class="btn-next" id="next-btn" onclick="nextQuestion()">Next Question &rarr;</button>
        </div>
    </div>
</div>
<script>
    const canvas = document.getElementById('bg-canvas');
    const ctx = canvas.getContext('2d');
    let width, height;
    function resizeCanvas() {
        width = canvas.width = window.innerWidth;
        height = canvas.height = window.innerHeight;
    }
    window.addEventListener('resize', resizeCanvas);
    resizeCanvas();
    class Cell {
        constructor() {
            this.x = Math.random() * width;
            this.y = Math.random() * height;
            this.radius = Math.random() * 25 + 15;
            this.vx = (Math.random() - 0.5) * 0.8;
            this.vy = (Math.random() - 0.5) * 0.8;
            this.pulse = Math.random() * Math.PI * 2;
        }
        update() {
            this.x += this.vx;
            this.y += this.vy;
            this.pulse += 0.02;
            if (this.x < -50) this.x = width + 50;
            if (this.x > width + 50) this.x = -50;
            if (this.y < -50) this.y = height + 50;
            if (this.y > height + 50) this.y = -50;
        }
        draw() {
            const currentRadius = this.radius + Math.sin(this.pulse) * 2;
            const grad = ctx.createRadialGradient(this.x, this.y, currentRadius * 0.2, this.x, this.y, currentRadius);
            grad.addColorStop(0, 'rgba(0, 163, 224, 0.4)');
            grad.addColorStop(0.7, 'rgba(0, 114, 206, 0.15)');
            grad.addColorStop(1, 'rgba(0, 114, 206, 0)');
            ctx.beginPath();
            ctx.arc(this.x, this.y, currentRadius, 0, Math.PI * 2);
            ctx.fillStyle = grad;
            ctx.fill();
            ctx.beginPath();
            ctx.arc(this.x, this.y, currentRadius, 0, Math.PI * 2);
            ctx.strokeStyle = 'rgba(0, 163, 224, 0.3)';
            ctx.lineWidth = 1.5;
            ctx.stroke();
            ctx.beginPath();
            ctx.arc(this.x + Math.sin(this.pulse) * 3, this.y + Math.cos(this.pulse) * 3, currentRadius * 0.25, 0, Math.PI * 2);
            ctx.fillStyle = 'rgba(0, 163, 224, 0.5)';
            ctx.fill();
        }
    }
    class Electron {
        constructor() {
            this.x = Math.random() * width;
            this.y = Math.random() * height;
            this.vx = (Math.random() - 0.5) * 2;
            this.vy = (Math.random() - 0.5) * 2;
            this.radius = Math.random() * 2 + 1;
        }
        update() {
            this.x += this.vx;
            this.y += this.vy;
            if (this.x < 0) this.x = width;
            if (this.x > width) this.x = 0;
            if (this.y < 0) this.y = height;
            if (this.y > height) this.y = 0;
        }
        draw() {
            ctx.beginPath();
            ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
            ctx.fillStyle = '#38BDF8';
            ctx.shadowBlur = 8;
            ctx.shadowColor = '#00A3E0';
            ctx.fill();
            ctx.shadowBlur = 0;
        }
    }
    const cells = Array.from({ length: 18 }, () => new Cell());
    const electrons = Array.from({ length: 40 }, () => new Electron());
    function animate() {
        ctx.clearRect(0, 0, width, height);
        for (let i = 0; i < cells.length; i++) {
            for (let j = i + 1; j < cells.length; j++) {
                const dx = cells[i].x - cells[j].x;
                const dy = cells[i].y - cells[j].y;
                const dist = Math.sqrt(dx * dx + dy * dy);
                if (dist < 180) {
                    ctx.beginPath();
                    ctx.moveTo(cells[i].x, cells[i].y);
                    ctx.lineTo(cells[j].x, cells[j].y);
                    ctx.strokeStyle = `rgba(0, 163, 224, ${0.25 * (1 - dist / 180)})`;
                    ctx.lineWidth = 1;
                    ctx.stroke();
                }
            }
        }
        cells.forEach(cell => { cell.update(); cell.draw(); });
        electrons.forEach(e => { e.update(); e.draw(); });
        requestAnimationFrame(animate);
    }
    animate();
    const bottleSvg = `<svg viewBox="0 0 30 40" fill="none" xmlns="http://www.w3.org/2000/svg"><rect x="10" y="2" width="10" height="5" rx="1" fill="#003B70"/><path d="M8 8C8 7 9 7 10 7H20C21 7 22 7 22 8L24 13V35C24 37 22 38 20 38H10C8 38 6 37 6 35V13L8 8Z" fill="#0072CE"/><rect x="8" y="16" width="14" height="14" rx="2" fill="#E6F4FA"/><text x="15" y="25" font-size="6" fill="#003B70" font-weight="bold" text-anchor="middle" font-family="'Outfit', sans-serif">ARS</text></svg>`;
    let audioMuted = false;
    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    function toggleAudio() {
        audioMuted = !audioMuted;
        const btn = document.getElementById('audio-toggle');
        btn.innerText = audioMuted ? "🔇 Muted" : "🔊 Sound On";
    }
    function playSound(type) {
        if (audioMuted) return;
        if (audioCtx.state === 'suspended') {
            audioCtx.resume();
        }
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        const now = audioCtx.currentTime;
        if (type === 'click') {
            osc.frequency.setValueAtTime(400, now);
            gain.gain.setValueAtTime(0.1, now);
            gain.gain.exponentialRampToValueAtTime(0.01, now + 0.05);
            osc.start(now);
            osc.stop(now + 0.05);
        } else if (type === 'correct') {
            osc.type = 'sine';
            osc.frequency.setValueAtTime(523.25, now);
            osc.frequency.setValueAtTime(659.25, now + 0.1);
            osc.frequency.setValueAtTime(783.99, now + 0.2);
            gain.gain.setValueAtTime(0.2, now);
            gain.gain.exponentialRampToValueAtTime(0.01, now + 0.4);
            osc.start(now);
            osc.stop(now + 0.4);
        } else if (type === 'incorrect') {
            osc.type = 'sawtooth';
            osc.frequency.setValueAtTime(180, now);
            osc.frequency.setValueAtTime(130, now + 0.15);
            gain.gain.setValueAtTime(0.2, now);
            gain.gain.exponentialRampToValueAtTime(0.01, now + 0.35);
            osc.start(now);
            osc.stop(now + 0.35);
        } else if (type === 'win') {
            osc.type = 'triangle';
            osc.frequency.setValueAtTime(440, now);
            osc.frequency.setValueAtTime(554.37, now + 0.12);
            osc.frequency.setValueAtTime(659.25, now + 0.24);
            osc.frequency.setValueAtTime(880, now + 0.36);
            gain.gain.setValueAtTime(0.25, now);
            gain.gain.exponentialRampToValueAtTime(0.01, now + 0.6);
            osc.start(now);
            osc.stop(now + 0.6);
        }
    }
    function triggerBottlePopout() {
        const overlay = document.getElementById('popout-overlay');
        const bottleEl = document.createElement('div');
        bottleEl.className = 'popout-bottle';
        bottleEl.innerHTML = bottleSvg;
        overlay.appendChild(bottleEl);
        setTimeout(() => {
            bottleEl.remove();
            addBottleToInventory();
        }, 1000);
    }
    function addBottleToInventory() {
        const inventory = document.getElementById('ars-inventory');
        const icon = document.createElement('div');
        icon.className = 'ars-bottle-icon';
        icon.innerHTML = bottleSvg;
        inventory.appendChild(icon);
    }
    const questions = [
        {
            q: "1. What is the main function of redox signaling molecules?",
            options: ["Digest food", "Help cells communicate and respond", "Build muscles directly", "Store oxygen"],
            answer: 1,
            explanation: "Redox signaling molecules act as crucial messengers that help cells communicate and trigger appropriate biological responses."
        },
        {
            q: "2. During oxidation, an atom:",
            options: ["Gains an electron", "Loses an electron", "Gains oxygen only", "Produces ATP"],
            answer: 1,
            explanation: "Oxidation is defined as the loss of an electron (remember OIL RIG: Oxidation Is Loss, Reduction Is Gain)."
        },
        {
            q: "3. When too many ROS are produced, it may result in:",
            options: ["Homeostasis", "Hydration", "Oxidative Stress", "Absorption"],
            answer: 2,
            explanation: "An overload of Reactive Oxygen Species (ROS) overwhelming cellular antioxidant defenses leads to Oxidative Stress."
        },
        {
            q: "4. Which of the following can be an oxidative stressor?",
            options: ["Pollution", "Poor diet", "Illness", "All of the above"],
            answer: 3,
            explanation: "Environmental toxins (pollution), poor nutrition, and disease/illness all trigger elevated oxidative stressors in the body."
        },
        {
            q: "5. In the right amount, ROS can:",
            options: ["Damage every cell", "Act as signaling molecules", "Stop communication between cells", "Eliminate antioxidants"],
            answer: 1,
            explanation: "In controlled, moderate concentrations, ROS serve essential functions as vital secondary cell signaling messengers."
        },
        {
            q: "6. Redox Homeostasis refers to:",
            options: ["Cell division", "Balance between oxidants and antioxidants", "ATP production", "Protein synthesis"],
            answer: 1,
            explanation: "Redox Homeostasis is the state of balance between oxidant generation (ROS) and cellular antioxidant defenses."
        },
        {
            q: "7. Where does ARS absorption begin?",
            options: ["Stomach", "Liver", "Mouth", "Skin"],
            answer: 2,
            explanation: "ARS absorption begins immediately upon contact in the oral cavity (mouth) via sublingual/mucosal pathways."
        },
        {
            q: "8. Which analogy best describes a cell signaling cascade?",
            options: ["Brick wall", "Domino effect", "Bicycle wheel", "Traffic light"],
            answer: 1,
            explanation: "A signaling cascade operates like a row of dominos: one initial signal triggers a sequential chain reaction across molecular pathways."
        },
        {
            q: "9. Why can different people experience different responses?",
            options: ["Signals are targeted to one organ only", "Everyone has identical needs", "Cells respond based on individual needs", "Redox molecules only affect muscles"],
            answer: 2,
            explanation: "Cells respond based on individual physiological needs, making response pathways personalized."
        },
        {
            q: "10. Which sequence correctly describes a cell signaling cascade?",
            options: [
                "Signal &rarr; Cell receives message &rarr; Cell sends more signals &rarr; Other cells respond",
                "Cell division &rarr; Digestion &rarr; Absorption &rarr; ATP",
                "ROS &rarr; Oxidative Stress &rarr; Illness &rarr; Repair",
                "Absorption &rarr; ATP &rarr; Oxidation &rarr; Reduction"
            ],
            answer: 0,
            explanation: "A cell signaling cascade is a step-by-step pathway where a signal triggers reception, relay, and multi-cellular response."
        }
    ];
    let currentQ = 0;
    let score = 0;
    let correctAnswers = 0;
    let currentStreak = 0;
    let maxStreak = 0;
    let answered = false;
    function loadQuestion() {
        answered = false;
        const qData = questions[currentQ];
        document.getElementById('question-count').innerText = `Question ${currentQ + 1} of ${questions.length}`;
        document.getElementById('correct-count').innerText = `Correct: ${correctAnswers} / ${questions.length}`;
        document.getElementById('score').innerText = `Score: ${score}`;
        document.getElementById('progress').style.width = `${((currentQ) / questions.length) * 100}%`;
        document.getElementById('question-text').innerText = qData.q;
        const streakEl = document.getElementById('streak-display');
        if (currentStreak > 1) {
            streakEl.style.display = 'inline-flex';
            streakEl.innerText = `🔥 Streak: ${currentStreak}`;
        } else {
            streakEl.style.display = 'none';
        }
        const optionsContainer = document.getElementById('options-container');
        optionsContainer.innerHTML = '';
        qData.options.forEach((opt, idx) => {
            const btn = document.createElement('button');
            btn.className = 'option-btn';
            btn.innerHTML = opt;
            btn.onclick = () => selectOption(idx);
            optionsContainer.appendChild(btn);
        });
        document.getElementById('explanation').style.display = 'none';
        document.getElementById('next-btn').style.display = 'none';
    }
    function selectOption(idx) {
        if (answered) return;
        answered = true;
        playSound('click');
        const qData = questions[currentQ];
        const buttons = document.querySelectorAll('.option-btn');
        const expBox = document.getElementById('explanation');
        buttons.forEach(btn => btn.disabled = true);
        if (idx === qData.answer) {
            correctAnswers++;
            currentStreak++;
            if (currentStreak > maxStreak) maxStreak = currentStreak;
            let bonus = currentStreak >= 3 ? 50 : 0;
            let pointsGained = 100 + bonus;
            score += pointsGained;
            playSound('correct');
            triggerBottlePopout();
            buttons[idx].classList.add('correct');
            let streakText = currentStreak >= 3 ? ` <span style="color:#D97706;">(${currentStreak}x Streak Bonus +${bonus}pts!)</span>` : '';
            expBox.innerHTML = `<strong>✅ Correct! (+${pointsGained} pts)${streakText}</strong><br>${qData.explanation}`;
            expBox.style.borderColor = 'var(--success)';
        } else {
            currentStreak = 0;
            playSound('incorrect');
            buttons[idx].classList.add('incorrect');
            buttons[qData.answer].classList.add('correct');
            expBox.innerHTML = `<strong>❌ Incorrect.</strong><br>${qData.explanation}`;
            expBox.style.borderColor = 'var(--danger)';
        }
        document.getElementById('correct-count').innerText = `Correct: ${correctAnswers} / ${questions.length}`;
        const streakEl = document.getElementById('streak-display');
        if (currentStreak > 1) {
            streakEl.style.display = 'inline-flex';
            streakEl.innerText = `🔥 Streak: ${currentStreak}`;
        } else {
            streakEl.style.display = 'none';
        }
        document.getElementById('score').innerText = `Score: ${score}`;
        expBox.style.display = 'block';
        document.getElementById('next-btn').style.display = 'inline-block';
    }
    function nextQuestion() {
        playSound('click');
        currentQ++;
        if (currentQ < questions.length) {
            loadQuestion();
        } else {
            showEndCard();
        }
    }
    function showEndCard() {
        playSound('win');
        document.getElementById('progress').style.width = '100%';
        const container = document.getElementById('game-body');
        let badgesHtml = '<div class="badges-container">';
        if (correctAnswers === questions.length) {
            badgesHtml += '<div class="achievement-badge gold">🏆 Cell Master (Perfect Score)</div>';
        } else if (correctAnswers >= 7) {
            badgesHtml += '<div class="achievement-badge blue">🔬 Redox Scholar</div>';
        } else {
            badgesHtml += '<div class="achievement-badge">🌱 Cellular Explorer</div>';
        }
        if (maxStreak >= 5) {
            badgesHtml += '<div class="achievement-badge purple">⚡ Signaling Cascade (5+ Streak)</div>';
        }
        badgesHtml += '</div>';
        container.innerHTML = `
            <div class="end-card">
                <h2>🎉 Knowledge Check Complete!</h2>
                <p>Your Final Score:</p>
                <div class="score-display">${score} pts</div>
                <div class="correct-summary">You got ${correctAnswers} out of ${questions.length} correct!</div>
                ${badgesHtml}
                <p style="font-size: 1.05rem; color: #475569;">${correctAnswers >= 8 ? "Outstanding mastery of Cell Signaling!" : "Good effort! Practice again to boost your score."}</p>
                <button class="restart-btn" onclick="restartGame()">Play Again</button>
            </div>
        `;
    }
    function restartGame() {
        currentQ = 0;
        score = 0;
        correctAnswers = 0;
        currentStreak = 0;
        maxStreak = 0;
        document.getElementById('ars-inventory').innerHTML = '';
        document.getElementById('game-body').innerHTML = `
            <div class="question-title" id="question-text"></div>
            <div class="options-grid" id="options-container"></div>
            <div class="explanation-box" id="explanation"></div>
            <div class="action-footer">
                <button class="btn-next" id="next-btn" onclick="nextQuestion()">Next Question &rarr;</button>
            </div>
        `;
        loadQuestion();
    }
    loadQuestion();
</script>
</body>
</html>
